# ==================================
# Render Blueprint Configuration
# ==================================
# Deploy: Connect GitHub repo → Select "Docker" runtime

services:
  - type: web
    name: clinicaperu-backend
    runtime: docker
    plan: free
    region: oregon

    # Docker configuration
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Build hook - runs after successful deploy
    buildCommand: ''

    # Health check
    healthCheckPath: /api

    # Environment variables (set manually in Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
